<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas de Materias</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #0066cc;
      color: white;
      padding: 1em;
    }
    h1 {
      margin: 0.5em 0;
    }
    .materia-btns {
      display: flex;
      justify-content: center;
      gap: 1em;
      margin-top: 1em;
      flex-wrap: wrap;
    }
    button {
      padding: 1em;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #0099ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #007acc;
    }
    .notas {
      display: none;
      margin-top: 2em;
    }
    .visible {
      display: block;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
    }
    td, th {
      border: 1px solid #ccc;
      padding: 10px;
    }
    .salir {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .salir img {
      height: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ver notas de:</h1>
    <div class="materia-btns">
      <button onclick="mostrarNotas('quimica')">Química</button>
      <button onclick="mostrarNotas('fisica')">Física</button>
      <button onclick="mostrarNotas('matematica')">Matemática</button>
    </div>
    <div class="salir">
      <img src="salir-icon.png" alt="Salir">
    </div>
  </header>

  <div id="quimica" class="notas">
    <h2>Notas - Química</h2>
    <table>
      <tr><th>Primer Parcial</th><th>Segundo Parcial</th><th>Nota Ingeniero</th><th>Nota Final</th></tr>
      <tr><td>82</td><td>90</td><td>80</td><td><strong>84</strong></td></tr>
    </table>
  </div>

  <div id="fisica" class="notas">
    <h2>Notas - Física</h2>
    <table>
      <tr><th>Primer Parcial</th><th>Segundo Parcial</th><th>Nota Ingeniero</th><th>Nota Final</th></tr>
      <tr><td>57</td><td>85</td><td>88</td><td><strong>74</strong></td></tr>
    </table>
  </div>

  <div id="matematica" class="notas">
    <h2>Notas - Matemática</h2>
    <table>
      <tr><th>Primer Parcial</th><th>Segundo Parcial</th><th>Nota Ingeniero</th><th>Nota Final</th></tr>
      <tr><td>62</td><td>34</td><td>30</td><td><strong>48</strong></td></tr>
    </table>
  </div>

  <script>
    function mostrarNotas(materia) {
      document.querySelectorAll('.notas').forEach(div => div.classList.remove('visible'));
      document.getElementById(materia).classList.add('visible');
    }
  </script>
</body>
</html>
